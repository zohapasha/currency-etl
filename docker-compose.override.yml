services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    labels:
      project: "currency-etl"
      description: "MongoDB storing daily exchange rates"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db          # persistent storage
    networks:
      - airflow                      # same network as Airflow containers

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    depends_on:
      - mongo
    labels:
      project: "currency-etl"
      description: "Web UI for MongoDB"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - airflow

volumes:
  mongo_data:
    driver: local